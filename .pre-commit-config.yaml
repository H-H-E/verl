repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: "v0.11.4" # Or a newer compatible version
    hooks:
      - id: ruff
        args: ["--fix", "--show-fixes", "--output-format=full"]
        exclude: ^.*\.(ipynb)$
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: 'v1.8.0'  # Or a newer compatible version
    hooks:
    -   id: mypy
        args: [--ignore-missing-imports] # Add other mypy args as needed
        exclude: ^(docs/|tests/|examples/|recipe/) # Exclude example and test files for now
